<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>動漫商品計算機結帳 App</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#64748b;--line:#dbe3ef;--primary:#2563eb;--dark:#0f172a;--danger:#dc2626;--ok:#16a34a;--shadow:0 10px 28px rgba(15,23,42,.08);--header-h:66px;--nav-h:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:var(--header-h);background:linear-gradient(135deg,#1e40af,#2563eb);color:white;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:sticky;top:0;z-index:3;box-shadow:var(--shadow)}h1{font-size:20px;margin:0}button,input,select,textarea{font:inherit;border-radius:14px;border:1px solid var(--line);padding:9px 11px}button{border:0;background:var(--primary);color:white;font-weight:800;cursor:pointer;min-height:40px}button:active{transform:scale(.98)}button.secondary{background:#e8eefc;color:#1d4ed8}button.dark{background:var(--dark)}button.ok{background:var(--ok);color:white}button.danger{background:#fee2e2;color:var(--danger)}button.ok{background:var(--ok);color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page{display:none;height:calc(100dvh - var(--header-h) - var(--nav-h));padding:12px;max-width:1440px;margin:auto;overflow:hidden}.page.active{display:block}.layout{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:12px;height:100%;overflow:hidden}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px;min-height:0}.left-card{display:flex;flex-direction:column;overflow:hidden}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}h2{font-size:18px;margin:0}h3{font-size:15px;color:#334155;margin:16px 0 8px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:850;white-space:nowrap}.search{width:100%;min-height:42px}.scroll{display:flex;gap:8px;flex-wrap:wrap;overflow:visible;padding:8px 0}.cat,.sub{flex:0 0 auto;background:#eef2ff;color:#3730a3;border:1px solid #dfe5ff;padding:8px 13px;min-height:38px}.cat.active{background:var(--primary);color:white}.sub{background:#f8fafc;color:#334155}.sub.active{background:var(--dark);color:white}.breadcrumb{margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-right:2px}.product{background:#fbfdff;border:1px solid var(--line);border-radius:16px;padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.product:active{transform:scale(.98)}.pname{font-weight:900}.pcat{color:var(--muted);font-size:12px;margin-top:5px}.price{color:var(--primary);font-size:21px;font-weight:950}
.cart{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:8px;overflow:hidden}.items{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fbfdff;-webkit-overflow-scrolling:touch}.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.qty{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}.qty button{width:34px;height:34px;min-height:34px;padding:0}.qty .remove{width:auto;padding:0 9px;font-size:13px}.custom{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:8px}.custom input{min-height:38px}.custom button{min-height:38px;white-space:nowrap}
.calc{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:8px}.display{background:white;border:1px solid var(--line);border-radius:16px;padding:9px 11px;margin-bottom:8px}.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-weight:900;margin-bottom:5px}.direct-input{width:150px;min-height:38px;text-align:right;font-weight:950;font-size:20px;color:var(--primary)}.calc-total-box{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}.calc-label{font-weight:900;margin-bottom:4px}.calc-expr{width:100%;min-height:42px;text-align:right;font-size:24px;font-weight:950;color:var(--dark);background:white}.big{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 8px}.big span{color:var(--muted);font-weight:900;font-size:16px}.big strong{font-size:28px;line-height:1.05;font-weight:950}.big.total strong{color:var(--primary);font-size:34px}.big.change-row strong{color:var(--ok);font-size:34px}.big.change-row.negative strong{color:var(--danger)}.cash-hide{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.keypad button{min-height:43px;font-size:18px;border-radius:14px}.total-keypad button{font-size:20px}.actions{display:grid;grid-template-columns:1fr;gap:8px}.actions .save{min-height:52px;font-size:19px;background:var(--ok)}.actions button{min-height:43px}
.nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:4}.nav button{background:#f1f5f9;color:#334155;border-radius:18px}.nav button.active{background:var(--dark);color:white}.empty{text-align:center;color:var(--muted);padding:22px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{background:#f3f6fb;color:#475569;font-weight:900;position:sticky;top:0;z-index:1}.num{text-align:right}.table-wrap{overflow:auto;max-height:calc(100dvh - 320px);border:1px solid var(--line);border-radius:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#f1f5f9;color:#334155}.tab.active{background:var(--dark);color:white}.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr 130px auto;gap:10px;align-items:end}.notice{padding:12px 14px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:16px;line-height:1.55;font-size:14px}.manage-table input{width:100%;min-width:100px}#historyPage,#settingsPage{overflow:auto;padding-bottom:calc(var(--nav-h) + 22px);height:calc(100dvh - var(--header-h))}
@media(max-width:980px){html,body{overflow:auto}.page{height:auto;overflow:visible}.layout{grid-template-columns:1fr;height:auto}.cart{height:auto;display:flex;flex-direction:column}.items{max-height:340px}.grid{max-height:none}.form-grid{grid-template-columns:1fr}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}header{height:auto;align-items:flex-start}.card{padding:10px}.actions{grid-template-columns:1fr}}

/* Tablet fit optimization v4 */
html, body {
  width: 100%;
  max-width: 100%;
}

body {
  overflow: auto;
}

#checkoutPage {
  height: calc(100dvh - var(--header-h) - var(--nav-h));
  overflow: hidden;
}

.layout {
  min-height: 0;
}

.cart {
  min-height: 0;
}

.display {
  padding: 8px 10px;
}

.calc-total-box {
  padding: 6px 8px;
  margin: 5px 0;
}

.calc-expr {
  min-height: 38px;
  font-size: 22px;
}

.big {
  padding-top: 2px;
  padding-bottom: 2px;
}

.big span {
  font-size: 15px;
}

.big strong {
  font-size: 25px;
}

.big.total strong,
.big.change-row strong {
  font-size: 30px;
}

.direct-input {
  min-height: 34px;
  font-size: 18px;
}

.keypad {
  gap: 6px;
}

.keypad button {
  min-height: 38px;
  font-size: 17px;
  padding: 7px 8px;
}

.item {
  padding: 9px 10px;
}

.qty {
  margin-top: 5px;
}

.qty button {
  width: 32px;
  height: 32px;
  min-height: 32px;
}

.actions {
  margin-top: 7px;
}

.actions .save {
  min-height: 48px;
}

.actions button {
  min-height: 40px;
}

/* iPad portrait / narrower tablets: allow page scroll, keep controls compact */
@media (max-width: 1100px) {
  html, body {
    overflow: auto;
  }

  #checkoutPage {
    height: auto;
    min-height: calc(100dvh - var(--header-h) - var(--nav-h));
    overflow-y: auto;
    padding-bottom: calc(var(--nav-h) + 18px);
  }

  .layout {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }

  .left-card,
  .cart {
    height: auto;
    max-height: none;
  }

  .grid {
    max-height: 40dvh;
    min-height: 220px;
    overflow: auto;
  }

  .cart {
    overflow: visible;
  }

  .items {
    max-height: 25dvh;
    min-height: 110px;
    overflow: auto;
  }

  .money {
    overflow: visible;
  }

  .keypad {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* Smaller portrait screens: further reduce keypad height */
@media (max-height: 900px) {
  .keypad button {
    min-height: 34px;
    font-size: 16px;
    padding: 6px 7px;
  }

  .calc-expr {
    min-height: 34px;
    font-size: 20px;
  }

  .big.total strong,
  .big.change-row strong {
    font-size: 28px;
  }

  .direct-input {
    min-height: 32px;
  }

  .items {
    min-height: 95px;
  }
}

/* Very small mobile fallback */
@media (max-width: 720px) {
  body {
    overflow: auto;
  }

  #checkoutPage {
    height: auto;
    overflow-y: auto;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-height: none;
  }

  .items {
    max-height: 280px;
  }
}

</style>
</head>
<body>
<header><div><h1>動漫商品平板結帳 App</h1><div style="font-size:12px;opacity:.9">計算機式結帳｜總計、實收、找零固定顯示</div></div><div class="row"><button class="secondary" onclick="openPage('checkout')">結帳</button><button class="secondary" onclick="openPage('history')">銷售紀錄</button><button class="secondary" onclick="openPage('settings')">商品設定</button></div></header>

<section id="checkoutPage" class="page active"><div class="layout">
<section class="card left-card"><div class="section-title"><div><h2>選擇商品</h2><div class="muted">先選主分類；有子分類會自動出現第二層。</div></div><span id="count" class="pill"></span></div><input id="search" class="search" placeholder="搜尋商品名稱、主分類或子分類" oninput="render()" /><div id="cats" class="scroll"></div><div id="subs" class="scroll"></div><div id="breadcrumb" class="muted breadcrumb"></div><div id="grid" class="grid"></div></section>
<aside class="card cart"><div class="section-title"><h2>本筆訂單</h2><button class="danger" onclick="clearCart()">清空</button></div><div class="custom"><div class="row"><input id="customName" placeholder="自訂品項，可空白" style="flex:1;min-width:130px"><input id="customPrice" type="number" min="0" step="1" placeholder="金額" style="width:110px"><button class="secondary" onclick="addCustomAmount()">加入</button></div></div><div id="cartBox" class="items"></div><div class="calc"><div class="display">
  <div class="mini">
    <span>折扣金額</span>
    <input id="discount" class="direct-input" type="number" min="0" step="1" value="0" inputmode="numeric">
  </div>

  <div class="calc-total-box">
    <div class="muted calc-label">總額計算</div>
    <input id="calcExpr" class="calc-expr" placeholder="例如 885+888+999+59" inputmode="numeric">
  </div>

  <div class="big total">
    <span>總計</span>
    <strong id="total">$0</strong>
  </div>

  <div class="mini">
    <span>實收</span>
    <input id="cash" class="direct-input" type="number" min="0" step="1" value="0" placeholder="輸入實收" inputmode="numeric">
  </div>

  <div class="big change-row">
    <span id="changeLabel">找零</span>
    <strong id="change">$0</strong>
  </div>
</div></div><div class="keypad total-keypad">
  <button type="button" onclick="pressCalcKey('7')">7</button><button type="button" onclick="pressCalcKey('8')">8</button><button type="button" onclick="pressCalcKey('9')">9</button><button type="button" class="secondary" onclick="pressCalcKey('+')">＋</button>
  <button type="button" onclick="pressCalcKey('4')">4</button><button type="button" onclick="pressCalcKey('5')">5</button><button type="button" onclick="pressCalcKey('6')">6</button><button type="button" class="secondary" onclick="pressCalcKey('-')">－</button>
  <button type="button" onclick="pressCalcKey('1')">1</button><button type="button" onclick="pressCalcKey('2')">2</button><button type="button" onclick="pressCalcKey('3')">3</button><button type="button" class="secondary" onclick="backspaceCalc()">⌫</button>
  <button type="button" onclick="clearCalc()">C</button><button type="button" onclick="pressCalcKey('0')">0</button><button type="button" onclick="pressCalcKey('00')">00</button><button type="button" class="ok" onclick="applyCalcResult()">＝</button>
</div></div><div class="actions"><button class="save" onclick="saveOrder()">完成並儲存訂單</button><button class="dark" onclick="openPage('history')">查看銷售紀錄</button></div></aside>
</div></section>

<section id="historyPage" class="page"><div class="card"><div class="section-title"><div><h2>銷售紀錄</h2><div class="muted">折扣金額欄會顯示每筆訂單扣多少，沒有折扣就是 0。</div></div><span class="pill" id="orderCount">0 筆</span></div><div class="tabs"><button class="tab active" id="tabSummary" onclick="switchHistory('summary')">訂單總表</button><button class="tab" id="tabDetail" onclick="switchHistory('detail')">商品明細</button></div><div class="row" style="margin:12px 0"><button onclick="exportExcel()">匯出 Excel (.xls)</button><button class="secondary" onclick="exportCSV()">匯出 CSV</button><button class="danger" onclick="clearHistory()">清除所有紀錄</button></div><div id="historyArea" class="table-wrap"></div></div></section>
<section id="settingsPage" class="page"><div class="card"><div class="section-title"><div><h2>商品設定</h2><div class="muted">支援主分類與子分類。新增主分類後會自動出現在結帳頁。</div></div></div><div class="notice">CSV 欄位格式：<strong>商品名稱, 主分類, 子分類, 價格</strong>。沒有子分類可留空。</div><div class="form-grid" style="margin-top:12px"><div><label>商品名稱</label><input id="newName" placeholder="例如：炭治郎徽章"></div><div><label>主分類</label><input id="newCategory" list="categoryList" placeholder="例如：鬼滅"><datalist id="categoryList"></datalist></div><div><label>子分類</label><input id="newSubCategory" placeholder="例如：徽章／卡片／立牌"></div><div><label>價格</label><input id="newPrice" type="number" min="0" step="1" placeholder="80"></div><button onclick="addProduct()">新增商品</button></div><h3>目前商品清單</h3><div class="table-wrap" style="max-height:520px"><table class="manage-table"><thead><tr><th>商品</th><th>主分類</th><th>子分類</th><th class="num">價格</th><th>操作</th></tr></thead><tbody id="productManage"></tbody></table></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="exportProductsCSV()">匯出商品設定 CSV</button><label class="secondary" style="display:inline-flex;align-items:center;min-height:44px;border-radius:14px;padding:11px 13px;cursor:pointer;color:#1d4ed8;background:#e8eefc;font-weight:800">匯入商品設定 CSV<input type="file" accept=".csv,text/csv" onchange="importProductsCSV(event)" style="display:none"></label><button class="danger" onclick="resetProducts()">恢復預設動漫分類</button></div></div></section>
<nav class="nav"><button id="navCheckout" class="active" onclick="openPage('checkout')">結帳</button><button id="navHistory" onclick="openPage('history')">銷售紀錄</button><button id="navSettings" onclick="openPage('settings')">商品設定</button></nav>

<script>
const PRODUCT_KEY='anime_pos_products_final_v1',ORDERS_KEY='anime_pos_orders_final_v1',mainCats=['全部','鬼滅','我英','排球','咒術','坂本','柯南','獵人','吉依卡哇','寶可夢','三麗鷗'];let current='全部',sub='全部',cart=[],historyMode='summary';function cryptoId(){return'id_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}const sampleProducts=[['鬼滅 徽章 商品A','鬼滅','徽章',80],['鬼滅 卡片 商品A','鬼滅','卡片',50],['鬼滅 立牌 商品A','鬼滅','立牌',120],['我英 商品A','我英','',100],['排球 商品A','排球','',100],['咒術 商品A','咒術','',100],['坂本 商品A','坂本','',100],['柯南 商品A','柯南','',100],['獵人 商品A','獵人','',100],['吉依卡哇 商品A','吉依卡哇','',100],['寶可夢 商品A','寶可夢','',100],['三麗鷗 商品A','三麗鷗','',100]].map(p=>({id:cryptoId(),name:p[0],category:p[1],sub:p[2],price:p[3]}));let products=loadProducts(),orders=loadOrders();if(!products.length){products=sampleProducts;saveProducts()}function money(n){return'$'+Math.round(Number(n||0)).toLocaleString('zh-TW')}function nowText(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}function dateFileName(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}function todayCompactDate(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}function generateOrderNo(){const prefix='ORD'+todayCompactDate();let max=0;orders.map(o=>String(o.orderNo||'')).filter(no=>no.startsWith(prefix)).forEach(no=>{const n=Number(no.slice(prefix.length));if(!Number.isNaN(n))max=Math.max(max,n)});return prefix+String(max+1).padStart(6,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function normalize(p){return{id:p.id||cryptoId(),name:String(p.name||'').trim(),category:String(p.category||'未分類').trim()||'未分類',sub:String(p.sub||p.subCategory||'').trim(),price:Number(p.price||0)}}function loadProducts(){try{return JSON.parse(localStorage.getItem(PRODUCT_KEY)||'[]').map(normalize).filter(p=>p.name)}catch{return[]}}function saveProducts(){localStorage.setItem(PRODUCT_KEY,JSON.stringify(products))}function loadOrders(){try{return JSON.parse(localStorage.getItem(ORDERS_KEY)||'[]')}catch{return[]}}function saveOrders(){localStorage.setItem(ORDERS_KEY,JSON.stringify(orders))}
function getMainCats(){let dyn=[...new Set(products.map(p=>p.category).filter(Boolean))];return['全部',...[...new Set([...mainCats.filter(c=>c!=='全部'),...dyn])]]}function openPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(page+'Page').classList.add('active');document.getElementById('nav'+page.charAt(0).toUpperCase()+page.slice(1)).classList.add('active');if(page==='history')renderHistory();if(page==='settings')renderManage()}function setCat(c){current=c;sub='全部';render()}function setSub(s){sub=s;render()}function getSubs(){if(current==='全部')return[];let arr=[...new Set(products.filter(p=>p.category===current&&p.sub).map(p=>p.sub))];return arr.length?['全部',...arr]:[]}function render(){count.textContent=products.length+' 項商品';let catsArr=getMainCats();if(current!=='全部'&&!catsArr.includes(current))current='全部';cats.innerHTML=catsArr.map(c=>`<button class="cat ${c===current?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');let ss=getSubs();subs.innerHTML=ss.map(s=>`<button class="sub ${s===sub?'active':''}" onclick="setSub('${s}')">${s}</button>`).join('');breadcrumb.textContent=current==='全部'?'目前顯示：全部商品':`目前顯示：${current}${sub!=='全部'?' ＞ '+sub:''}`;let q=search.value.trim().toLowerCase();let list=products.filter(p=>(current==='全部'||p.category===current)&&(sub==='全部'||p.sub===sub)&&(!q||`${p.name} ${p.category} ${p.sub}`.toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(p=>`<div class="product" onclick="add('${p.id}')"><div><div class="pname">${esc(p.name)}</div><div class="pcat">${esc(p.category)}${p.sub?' ＞ '+esc(p.sub):''}</div></div><div class="price">${money(p.price)}</div></div>`).join(''):'<div class="empty">目前分類沒有商品</div>';renderManage()}
function add(id){let p=products.find(x=>x.id===id),it=cart.find(x=>x.id===id);if(it)it.qty++;else cart.push({...p,qty:1});renderCart()}function addCustomAmount(){let price=Number(customPrice.value),name=(customName.value||'自訂金額').trim()||'自訂金額';if(Number.isNaN(price)||price<=0)return alert('請輸入正確的自訂金額');cart.push({id:cryptoId(),name,category:'自訂',sub:'',price,qty:1});customName.value='';customPrice.value='';renderCart()}function adj(id,d){let it=cart.find(x=>x.id===id);if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart()}function parsePositiveNumberFromInput(id){
  const el = document.getElementById(id);
  if (!el) return 0;
  const value = String(el.value || '').replace(/,/g, '').trim();
  const number = Number(value);
  return Number.isFinite(number) && number > 0 ? number : 0;
}

function itemsSubtotal(){
  return cart.reduce((sum, item) => {
    return sum + Number(item.price || 0) * Number(item.qty || 0);
  }, 0);
}

function evaluateTotalExpression(){
  const el = document.getElementById('calcExpr');
  const expr = String(el ? el.value : '').replace(/＋/g, '+').replace(/－/g, '-').trim();

  if (!expr) return null;                 // 沒輸入總額計算，就用商品小計
  if (!/^[0-9+\-\s]+$/.test(expr)) return null;
  if (/[+\-]$/.test(expr)) return null;   // 還在輸入 885+，不要報錯，也不要更新成錯誤值

  try {
    const result = Function('return (' + expr + ')')();
    if (!Number.isFinite(result) || result < 0) return null;
    return Math.round(result);
  } catch (e) {
    return null;
  }
}

function getCheckoutState(){
  const subtotal = Math.round(itemsSubtotal());
  const expressionTotal = evaluateTotalExpression();
  const baseTotal = expressionTotal === null ? subtotal : expressionTotal;
  const discount = Math.min(Math.round(parsePositiveNumberFromInput('discount')), baseTotal);
  const total = Math.max(0, baseTotal - discount);
  const cash = Math.round(parsePositiveNumberFromInput('cash'));
  const change = cash - total;

  return { subtotal, baseTotal, discount, total, cash, change };
}

function recalculateCheckout(){
  const state = getCheckoutState();

  const totalEl = document.getElementById('total');
  const changeEl = document.getElementById('change');
  const changeLabelEl = document.getElementById('changeLabel');
  const changeRow = document.querySelector('.change-row');

  if (totalEl) totalEl.textContent = money(state.total);
  if (changeEl) changeEl.textContent = money(Math.abs(state.change));
  if (changeLabelEl) changeLabelEl.textContent = state.change < 0 ? '尚缺' : '找零';
  if (changeRow) changeRow.classList.toggle('negative', state.change < 0);

  return state;
}

function renderCart(refreshItems=true){
  if (refreshItems) {
    cartBox.innerHTML = cart.length
      ? cart.map(i => `<div class="item"><div><b>${esc(i.name)}</b><div class="muted">${esc(i.category)}${i.sub?' ＞ '+esc(i.sub):''}｜單價 ${money(i.price)}</div><div class="qty"><button class="secondary" onclick="adj('${i.id}',-1)">−</button><span>${i.qty}</span><button class="secondary" onclick="adj('${i.id}',1)">＋</button><button class="danger remove" onclick="removeItem('${i.id}')">移除</button></div></div><b>${money(Number(i.price||0)*Number(i.qty||0))}</b></div>`).join('')
      : '<div class="empty">可不加入商品，直接用總額計算結帳</div>';
  }
  recalculateCheckout();
}

function clearCart(){
  if (cart.length && !confirm('確定清空本筆訂單？')) return;
  cart = [];
  const discountEl = document.getElementById('discount');
  const calcExprEl = document.getElementById('calcExpr');
  const cashEl = document.getElementById('cash');

  if (discountEl) discountEl.value = 0;
  if (calcExprEl) calcExprEl.value = '';
  if (cashEl) cashEl.value = 0;

  renderCart(true);
}

function pressCalcKey(k){
  const el = document.getElementById('calcExpr');
  if (!el) return;

  let cur = String(el.value || '');
  const ops = ['+', '-'];

  if (ops.includes(k)) {
    if (!cur) return;
    if (ops.includes(cur.slice(-1))) cur = cur.slice(0, -1);
    el.value = cur + k;
  } else {
    el.value = (cur + k).replace(/^0+(?=\d)/, '');
  }

  recalculateCheckout();
}

function clearCalc(){
  const el = document.getElementById('calcExpr');
  if (el) el.value = '';
  recalculateCheckout();
}

function backspaceCalc(){
  const el = document.getElementById('calcExpr');
  if (el) el.value = String(el.value || '').slice(0, -1);
  recalculateCheckout();
}

function applyCalcResult(){
  const el = document.getElementById('calcExpr');
  if (!el) return;

  const result = evaluateTotalExpression();
  if (result !== null) el.value = String(result);
  recalculateCheckout();
}

function saveOrder(){
  const state = recalculateCheckout();

  if (state.total <= 0) {
    return alert('總計為 0，請先輸入總額再儲存。');
  }

  if (state.cash < state.total && !confirm('實收金額少於應收金額，仍要儲存嗎？')) return;

  const savedItems = cart.length
    ? cart.map(i => ({...i, lineTotal: Math.round(Number(i.price || 0) * Number(i.qty || 0))}))
    : [{
        id: cryptoId(),
        name: '未輸入商品',
        category: '快速結帳',
        sub: '',
        price: state.total,
        qty: 1,
        lineTotal: state.total
      }];

  const order = {
    orderNo: generateOrderNo(),
    createdAt: nowText(),
    items: savedItems,
    subtotal: state.subtotal || state.baseTotal || state.total,
    discountAmount: state.discount,
    total: state.total,
    cashReceived: state.cash,
    change: Math.round(state.change)
  };

  orders.unshift(order);
  saveOrders();
  clearCart();
  renderHistory();
  alert('已儲存訂單：' + order.orderNo);
}
function switchHistory(m){historyMode=m;tabSummary.classList.toggle('active',m==='summary');tabDetail.classList.toggle('active',m==='detail');renderHistory()}function renderHistory(){orderCount.textContent=orders.length+' 筆';if(!orders.length){historyArea.innerHTML='<div class="empty">目前沒有銷售紀錄</div>';return}if(historyMode==='summary'){historyArea.innerHTML=`<table><thead><tr><th>時間</th><th>訂單編號</th><th class="num">小計</th><th class="num">折扣金額</th><th class="num">應收</th><th class="num">實收</th><th class="num">找零</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.createdAt)}</td><td>${esc(o.orderNo)}</td><td class="num">${money(o.subtotal)}</td><td class="num">${money(o.discountAmount)}</td><td class="num">${money(o.total)}</td><td class="num">${money(o.cashReceived)}</td><td class="num">${money(o.change)}</td></tr>`).join('')}</tbody></table>`}else{let rows=orders.flatMap(o=>o.items.map(i=>({...i,orderNo:o.orderNo,createdAt:o.createdAt,orderTotal:o.total})));historyArea.innerHTML=`<table><thead><tr><th>時間</th><th>訂單編號</th><th>主分類</th><th>子分類</th><th>商品</th><th class="num">單價</th><th class="num">數量</th><th class="num">小計</th><th class="num">訂單應收</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.createdAt)}</td><td>${esc(r.orderNo)}</td><td>${esc(r.category)}</td><td>${esc(r.sub)}</td><td>${esc(r.name)}</td><td class="num">${money(r.price)}</td><td class="num">${r.qty}</td><td class="num">${money(r.lineTotal)}</td><td class="num">${money(r.orderTotal)}</td></tr>`).join('')}</tbody></table>`}}function clearHistory(){if(!orders.length)return alert('目前沒有銷售紀錄');if(!confirm('確定清除所有銷售紀錄？'))return;orders=[];saveOrders();renderHistory()}
function renderManage(){if(!productManage)return;let sorted=[...products].sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant')||a.sub.localeCompare(b.sub,'zh-Hant')||a.name.localeCompare(b.name,'zh-Hant'));productManage.innerHTML=sorted.map(p=>`<tr><td><input value="${esc(p.name)}" onchange="editProduct('${p.id}','name',this.value)"></td><td><input value="${esc(p.category)}" onchange="editProduct('${p.id}','category',this.value)"></td><td><input value="${esc(p.sub)}" onchange="editProduct('${p.id}','sub',this.value)"></td><td class="num"><input type="number" value="${p.price}" onchange="editProduct('${p.id}','price',this.value)"></td><td><button class="danger" onclick="deleteProduct('${p.id}')">刪除</button></td></tr>`).join('');categoryList.innerHTML=getMainCats().filter(c=>c!=='全部').map(c=>`<option value="${esc(c)}"></option>`).join('')}function addProduct(){let name=newName.value.trim(),category=newCategory.value.trim()||'未分類',sub=newSubCategory.value.trim(),price=Number(newPrice.value);if(!name)return alert('請輸入商品名稱');if(Number.isNaN(price)||price<0)return alert('請輸入正確價格');products.push({id:cryptoId(),name,category,sub,price});saveProducts();newName.value='';newCategory.value='';newSubCategory.value='';newPrice.value='';current=category;window.sub=sub||'全部';render();alert('已新增商品')}function editProduct(id,field,value){let p=products.find(x=>x.id===id);if(!p)return;if(field==='price'){let n=Number(value);if(Number.isNaN(n)||n<0)return alert('價格不可為負數');p.price=n}else{p[field]=String(value).trim();if(field==='category'&&!p[field])p[field]='未分類'}saveProducts();cart.forEach(i=>{if(i.id===id)Object.assign(i,p)});render();renderCart()}function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p)return;if(!confirm('確定刪除「'+p.name+'」？'))return;products=products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);saveProducts();render();renderCart()}function resetProducts(){if(!confirm('確定恢復預設動漫分類？目前商品設定會被覆蓋。'))return;products=sampleProducts.map(p=>({...p,id:cryptoId()}));saveProducts();current='全部';sub='全部';render()}
function exportProductsCSV(){downloadText(toCSV(products.map(p=>({'商品名稱':p.name,'主分類':p.category,'子分類':p.sub,'價格':p.price}))),`商品設定_${dateFileName()}.csv`,'text/csv;charset=utf-8;')}function importProductsCSV(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let rows=parseCSV(ev.target.result).filter(r=>r.some(c=>String(c).trim()!==''));let start=0,idx={name:0,cat:1,sub:2,price:3};let first=(rows[0]||[]).map(x=>String(x).trim().toLowerCase());if(first.some(h=>['商品名稱','商品','name','主分類','分類','category','子分類','subcategory','價格','price'].includes(h))){start=1;idx.name=findHeaderIndex(first,['商品名稱','商品','name']);idx.cat=findHeaderIndex(first,['主分類','分類','category']);idx.sub=findHeaderIndex(first,['子分類','subcategory','類型']);idx.price=findHeaderIndex(first,['價格','price','售價']);if(idx.name<0)idx.name=0;if(idx.cat<0)idx.cat=1;if(idx.sub<0)idx.sub=2;if(idx.price<0)idx.price=rows[0].length>=4?3:2}else if(rows[0].length===3){idx={name:0,cat:1,sub:-1,price:2}}let imported=[];for(let i=start;i<rows.length;i++){let r=rows[i],name=String(r[idx.name]??'').trim(),category=String(r[idx.cat]??'未分類').trim()||'未分類',sub=idx.sub>=0?String(r[idx.sub]??'').trim():'',price=Number(String(r[idx.price]??'').replace(/[$,\s]/g,''));if(name&&!Number.isNaN(price)&&price>=0)imported.push({id:cryptoId(),name,category,sub,price})}if(!imported.length)return alert('沒有成功匯入任何商品');if(!confirm(`將匯入 ${imported.length} 項商品，並覆蓋目前商品清單。確定繼續？`))return;products=imported;cart=[];saveProducts();current='全部';sub='全部';render();renderCart()}catch(err){alert('匯入失敗，請確認 CSV 格式')}finally{e.target.value=''}};reader.readAsText(file,'utf-8')}
function getExportRows(){let summary=orders.map(o=>({'時間':o.createdAt,'訂單編號':o.orderNo,'小計':o.subtotal,'折扣金額':o.discountAmount,'應收':o.total,'實收':o.cashReceived,'找零':o.change}));let detail=orders.flatMap(o=>o.items.map(i=>({'時間':o.createdAt,'訂單編號':o.orderNo,'主分類':i.category,'子分類':i.sub,'商品':i.name,'單價':i.price,'數量':i.qty,'商品小計':i.lineTotal,'訂單應收':o.total})));return{summary,detail}}function exportCSV(){if(!orders.length)return alert('目前沒有可匯出的銷售紀錄');let{summary,detail}=getExportRows();downloadText(toCSV(summary),`訂單總表_${dateFileName()}.csv`,'text/csv;charset=utf-8;');setTimeout(()=>downloadText(toCSV(detail),`商品明細_${dateFileName()}.csv`,'text/csv;charset=utf-8;'),250)}function exportExcel(){if(!orders.length)return alert('目前沒有可匯出的銷售紀錄');let{summary,detail}=getExportRows();downloadText(`<html><head><meta charset="UTF-8"></head><body><h2>訂單總表</h2>${rowsToTable(summary)}<br><h2>商品明細</h2>${rowsToTable(detail)}</body></html>`,`銷售紀錄_${dateFileName()}.xls`,'application/vnd.ms-excel;charset=utf-8;')}function rowsToTable(rows){if(!rows.length)return'<table></table>';let keys=Object.keys(rows[0]);return`<table border="1"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function toCSV(rows){if(!rows.length)return'';let keys=Object.keys(rows[0]),e=v=>`"${String(v??'').replace(/"/g,'""')}"`;return'\uFEFF'+keys.join(',')+'\n'+rows.map(r=>keys.map(k=>e(r[k])).join(',')).join('\n')}function parseCSV(text){let rows=[],row=[],cell='',q=false;text=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let ch=text[i],nx=text[i+1];if(ch==='"'&&q&&nx==='"'){cell+='"';i++}else if(ch==='"')q=!q;else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);rows.push(row);return rows}function findHeaderIndex(headers,cands){return headers.findIndex(h=>cands.map(c=>c.toLowerCase()).includes(h))}function downloadText(text,filename,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
