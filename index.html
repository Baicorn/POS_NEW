<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>動漫商品平板結帳 App</title>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--text:#111827;--muted:#64748b;--line:#dbe3ef;
  --primary:#2563eb;--dark:#0f172a;--danger:#dc2626;--ok:#16a34a;
  --shadow:0 10px 28px rgba(15,23,42,.08);--nav-h:70px;--header-h:68px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:var(--header-h);background:linear-gradient(135deg,#1e40af,#2563eb);color:white;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;top:0;z-index:3;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0}
button,input,select,textarea{font:inherit;border-radius:14px;border:1px solid var(--line);padding:10px 12px}
button{border:0;background:var(--primary);color:white;font-weight:800;cursor:pointer;min-height:42px}
button:active{transform:scale(.98)}
button.secondary{background:#e8eefc;color:#1d4ed8}
button.dark{background:var(--dark)}
button.danger{background:#fee2e2;color:var(--danger)}
button.ok{background:var(--ok);color:white}
.page{display:none;padding:16px 16px calc(var(--nav-h) + 22px);max-width:1440px;margin:auto}
.page.active{display:block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h2{font-size:19px;margin:0}
h3{font-size:15px;color:#334155;margin:18px 0 10px}
.muted{color:var(--muted);font-size:13px}
.search{width:100%;min-height:48px}
.scroll{display:flex;gap:9px;flex-wrap:wrap;overflow:visible;padding:12px 0}
.cat,.sub{flex:0 0 auto;background:#eef2ff;color:#3730a3;border:1px solid #dfe5ff}
.cat.active{background:var(--primary);color:white}
.sub{background:#f8fafc;color:#334155}
.sub.active{background:var(--dark);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;align-content:start;max-height:calc(100dvh - 245px);overflow:auto;-webkit-overflow-scrolling:touch}
.product{background:#fbfdff;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}
.product:active{transform:scale(.98)}
.pname{font-weight:900}
.pcat{color:var(--muted);font-size:12px;margin-top:5px}
.price{color:var(--primary);font-size:22px;font-weight:950}

.cart{
  position:sticky;
  top:calc(var(--header-h) + 10px);
  height:calc(100dvh - var(--header-h) - var(--nav-h) - 34px);
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.custom-amount{
  flex:0 0 auto;
  margin-bottom:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
}
.custom-amount .row{gap:8px}
.custom-amount input{min-height:40px}
.custom-amount button{min-height:40px;white-space:nowrap}
.items{
  flex:1 1 48%;
  min-height:230px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fbfdff;
  -webkit-overflow-scrolling:touch;
}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.qty{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qty button{width:36px;height:36px;min-height:36px;padding:0}
.qty .remove{width:auto;padding:0 10px;font-size:13px}
.money{
  flex:0 0 auto;
  margin-top:10px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  max-height:31dvh;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
textarea{min-height:42px;resize:vertical}
.sum{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #d5deeb}
.sum strong{font-size:20px}
.total strong{font-size:28px;color:var(--primary)}
.change{font-size:24px;color:var(--ok);font-weight:950}
.actions{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
  padding-bottom:18px;
}
.actions .save{grid-column:1/-1;min-height:56px;font-size:19px;background:var(--ok)}
.actions button{min-height:46px}
.nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:4}
.nav button{background:#f1f5f9;color:#334155;border-radius:18px}
.nav button.active{background:var(--dark);color:white}
.empty{text-align:center;color:var(--muted);padding:22px}
.pill{display:inline-flex;align-items:center;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:850;white-space:nowrap}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{background:#f3f6fb;color:#475569;font-weight:900;position:sticky;top:0;z-index:1}
.num{text-align:right}
.table-wrap{overflow:auto;max-height:calc(100dvh - 320px);border:1px solid var(--line);border-radius:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:#f1f5f9;color:#334155}
.tab.active{background:var(--dark);color:white}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr 130px auto;gap:10px;align-items:end}
.notice{padding:12px 14px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:16px;line-height:1.55;font-size:14px}
.manage-table input{width:100%;min-width:100px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.active{display:flex}
.modal{background:white;width:min(520px,100%);border-radius:24px;box-shadow:0 24px 60px rgba(15,23,42,.25);padding:18px;max-height:90dvh;overflow:auto}
.cash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cash-grid button{background:#eef2ff;color:#3730a3;min-height:50px}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .cart{position:relative;top:auto;height:auto;overflow:visible}
  .grid{max-height:none}
  .items{max-height:360px}
  .money{max-height:none}
}
@media(max-width:720px){
  .grid{grid-template-columns:repeat(2,1fr)}
  header{height:auto;align-items:flex-start}
  .layout{gap:12px}
  .card{padding:12px}
  .form-grid{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div><h1>動漫商品平板結帳 App</h1><div style="font-size:12px;opacity:.9">鬼滅含徽章、卡片、立牌｜正式版</div></div>
  <div class="row">
    <button class="secondary" onclick="openPage('checkout')">結帳</button>
    <button class="secondary" onclick="openPage('history')">銷售紀錄</button>
    <button class="secondary" onclick="openPage('settings')">商品設定</button>
  </div>
</header>

<section id="checkoutPage" class="page active">
  <div class="layout">
    <section class="card">
      <div class="section-title">
        <div><h2>選擇商品</h2><div class="muted">先選動漫主分類；鬼滅會出現第二層分類。</div></div>
        <span id="count" class="pill"></span>
      </div>
      <input id="search" class="search" placeholder="搜尋商品名稱、主分類或子分類" oninput="render()" />
      <div id="cats" class="scroll"></div>
      <div id="subs" class="scroll"></div>
      <div id="breadcrumb" class="muted" style="margin-bottom:10px"></div>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="card cart">
      <div class="section-title"><h2>本筆訂單</h2><button class="danger" onclick="clearCart()">清空</button></div>
      <div class="custom-amount">
        <div class="field">
          <label>自訂金額</label>
          <div class="row">
            <input id="customName" placeholder="品項名稱，可空白" style="flex:1;min-width:130px" />
            <input id="customPrice" type="number" min="0" step="1" placeholder="金額" style="width:110px" />
            <button class="secondary" onclick="addCustomAmount()">加入</button>
          </div>
        </div>
      </div>

      <div id="cartBox" class="items"></div>

      <div class="money">
        <div class="row">
          <div class="field"><label>折扣類型</label><select id="dtype" onchange="renderCart()"><option value="amount">折扣金額</option><option value="percent">折扣百分比</option></select></div>
          <div class="field"><label>折扣</label><input id="discount" type="number" value="0" oninput="renderCart()" /></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div class="field"><label>實收金額</label><input id="cash" type="number" value="0" oninput="renderCart()" /></div>
          <button class="secondary" onclick="openCashModal()" style="align-self:end">快速收款</button>
        </div>
        <div class="field" style="margin-top:8px"><label>訂單備註</label><textarea id="note" placeholder="例如：客人姓名、特殊需求"></textarea></div>
        <div class="sum"><span>小計</span><strong id="subtotal">$0</strong></div>
        <div class="sum"><span>折扣</span><strong id="discountShow">$0</strong></div>
        <div class="sum total"><span>應收</span><strong id="total">$0</strong></div>
        <div class="sum"><span>實收</span><strong id="cashShow">$0</strong></div>
        <div class="sum"><span>找零 / 尚缺</span><span class="change" id="change">$0</span></div>
      </div>

      <div class="actions">
        <button class="save" onclick="saveOrder()">完成並儲存訂單</button>
        <button class="secondary" onclick="copyReceipt()">複製收據</button>
        <button class="dark" onclick="openPage('history')">查看銷售紀錄</button>
      </div>
    </aside>
  </div>
</section>

<section id="historyPage" class="page">
  <div class="card">
    <div class="section-title"><div><h2>銷售紀錄</h2><div class="muted">資料儲存在瀏覽器本機，請定期匯出備份。</div></div><span class="pill" id="orderCount">0 筆</span></div>
    <div class="tabs"><button class="tab active" id="tabSummary" onclick="switchHistory('summary')">訂單總表</button><button class="tab" id="tabDetail" onclick="switchHistory('detail')">商品明細</button></div>
    <div class="row" style="margin:12px 0"><button onclick="exportExcel()">匯出 Excel (.xls)</button><button class="secondary" onclick="exportCSV()">匯出 CSV</button><button class="danger" onclick="clearHistory()">清除所有紀錄</button></div>
    <div id="historyArea" class="table-wrap"></div>
  </div>
</section>

<section id="settingsPage" class="page">
  <div class="card">
    <div class="section-title"><div><h2>商品設定</h2><div class="muted">支援主分類與子分類。鬼滅可設定為：徽章／卡片／立牌。</div></div></div>
    <div class="notice">CSV 欄位格式：<strong>商品名稱, 主分類, 子分類, 價格</strong>。沒有子分類可留空。</div>
    <div class="form-grid" style="margin-top:12px">
      <div class="field"><label>商品名稱</label><input id="newName" placeholder="例如：炭治郎徽章" /></div>
      <div class="field"><label>主分類</label><input id="newCategory" list="categoryList" placeholder="例如：鬼滅" /><datalist id="categoryList"></datalist></div>
      <div class="field"><label>子分類</label><input id="newSubCategory" placeholder="例如：徽章／卡片／立牌" /></div>
      <div class="field"><label>價格</label><input id="newPrice" type="number" min="0" step="1" placeholder="80" /></div>
      <button onclick="addProduct()">新增商品</button>
    </div>
    <h3>目前商品清單</h3>
    <div class="table-wrap" style="max-height:520px"><table class="manage-table"><thead><tr><th>商品</th><th>主分類</th><th>子分類</th><th class="num">價格</th><th>操作</th></tr></thead><tbody id="productManage"></tbody></table></div>
    <div class="row" style="margin-top:14px">
      <button class="secondary" onclick="exportProductsCSV()">匯出商品設定 CSV</button>
      <label class="secondary" style="display:inline-flex;align-items:center;min-height:44px;border-radius:14px;padding:11px 13px;cursor:pointer;color:#1d4ed8;background:#e8eefc;font-weight:800">匯入商品設定 CSV<input type="file" accept=".csv,text/csv" onchange="importProductsCSV(event)" style="display:none" /></label>
      <button class="danger" onclick="resetProducts()">恢復預設動漫分類</button>
    </div>
  </div>
</section>

<nav class="nav">
  <button id="navCheckout" class="active" onclick="openPage('checkout')">結帳</button>
  <button id="navHistory" onclick="openPage('history')">銷售紀錄</button>
  <button id="navSettings" onclick="openPage('settings')">商品設定</button>
</nav>

<div id="cashModal" class="modal-backdrop"><div class="modal">
  <div class="section-title"><h2>快速收款</h2><button class="danger" onclick="closeCashModal()">關閉</button></div>
  <div class="sum total"><span>應收金額</span><strong id="modalTotal">$0</strong></div>
  <div class="field" style="margin-top:12px"><label>實收金額</label><input id="modalCashInput" type="number" /></div>
  <div class="cash-grid"><button onclick="setExactCash()">剛好</button><button onclick="addCash(100)">+100</button><button onclick="addCash(500)">+500</button><button onclick="addCash(1000)">+1000</button><button onclick="roundCash(10)">進位 10</button><button onclick="roundCash(100)">進位 100</button></div>
  <div class="row" style="margin-top:14px"><button style="flex:1" onclick="applyCash()">套用</button></div>
</div></div>

<script>
const PRODUCT_KEY='anime_pos_products_final_v1';
const ORDERS_KEY='anime_pos_orders_final_v1';
const mainCats=['全部','鬼滅','我英','排球','咒術','坂本','柯南','獵人','吉依卡哇','寶可夢','三麗鷗'];
let current='全部', sub='全部', cart=[], historyMode='summary';
const sampleProducts=[
{name:'鬼滅 徽章 商品A',category:'鬼滅',sub:'徽章',price:80},
{name:'鬼滅 卡片 商品A',category:'鬼滅',sub:'卡片',price:50},
{name:'鬼滅 立牌 商品A',category:'鬼滅',sub:'立牌',price:120},
{name:'我英 商品A',category:'我英',sub:'',price:100},
{name:'排球 商品A',category:'排球',sub:'',price:100},
{name:'咒術 商品A',category:'咒術',sub:'',price:100},
{name:'坂本 商品A',category:'坂本',sub:'',price:100},
{name:'柯南 商品A',category:'柯南',sub:'',price:100},
{name:'獵人 商品A',category:'獵人',sub:'',price:100},
{name:'吉依卡哇 商品A',category:'吉依卡哇',sub:'',price:100},
{name:'寶可夢 商品A',category:'寶可夢',sub:'',price:100},
{name:'三麗鷗 商品A',category:'三麗鷗',sub:'',price:100}
].map(p=>({...p,id:cryptoId()}));
let products=loadProducts(),orders=loadOrders();

function cryptoId(){return'id_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function money(n){return '$'+Math.round(Number(n||0)).toLocaleString('zh-TW')}
function nowText(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function dateFileName(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
function todayCompactDate(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}
function generateOrderNo(){const prefix='ORD'+todayCompactDate();let max=0;orders.map(o=>String(o.orderNo||'')).filter(no=>no.startsWith(prefix)).forEach(no=>{const n=Number(no.slice(prefix.length));if(!Number.isNaN(n))max=Math.max(max,n)});return prefix+String(max+1).padStart(6,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function loadProducts(){try{return JSON.parse(localStorage.getItem(PRODUCT_KEY)||'[]').map(normalize).filter(p=>p.name)}catch{return[]} finally{}}
if(!products.length){products=sampleProducts;saveProducts()}
function normalize(p){return{id:p.id||cryptoId(),name:String(p.name||'').trim(),category:String(p.category||'未分類').trim()||'未分類',sub:String(p.sub||p.subCategory||'').trim(),price:Number(p.price||0)}}
function saveProducts(){localStorage.setItem(PRODUCT_KEY,JSON.stringify(products))}
function loadOrders(){try{return JSON.parse(localStorage.getItem(ORDERS_KEY)||'[]')}catch{return[]}}
function saveOrders(){localStorage.setItem(ORDERS_KEY,JSON.stringify(orders))}
function openPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(page+'Page').classList.add('active');document.getElementById('nav'+page.charAt(0).toUpperCase()+page.slice(1)).classList.add('active');if(page==='history')renderHistory();if(page==='settings')renderManage();scrollTo({top:0,behavior:'smooth'})}
function getMainCategoryButtons(){
  let dynamic=[...new Set(products.map(p=>p.category).filter(Boolean))];
  return ['全部', ...[...new Set([...mainCats.filter(c=>c!=='全部'), ...dynamic])]];
}
function setCat(c){current=c;sub='全部';render()}
function setSub(s){sub=s;render()}
function getSubs(){if(current==='全部')return[];let arr=[...new Set(products.filter(p=>p.category===current&&p.sub).map(p=>p.sub))];return arr.length?['全部',...arr]:[]}
function render(){count.textContent=products.length+' 項商品';let catList=getMainCategoryButtons();if(current!=='全部'&&!catList.includes(current))current='全部';cats.innerHTML=catList.map(c=>`<button class="cat ${c===current?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');let ss=getSubs();subs.innerHTML=ss.map(s=>`<button class="sub ${s===sub?'active':''}" onclick="setSub('${s}')">${s}</button>`).join('');breadcrumb.textContent=current==='全部'?'目前顯示：全部商品':`目前顯示：${current}${sub!=='全部'?' ＞ '+sub:''}`;let q=search.value.trim().toLowerCase();let list=products.filter(p=>(current==='全部'||p.category===current)&&(sub==='全部'||p.sub===sub)&&(!q||`${p.name} ${p.category} ${p.sub}`.toLowerCase().includes(q)));grid.innerHTML=list.length?list.map(p=>`<div class="product" onclick="add('${p.id}')"><div><div class="pname">${esc(p.name)}</div><div class="pcat">${esc(p.category)}${p.sub?' ＞ '+esc(p.sub):''}</div></div><div class="price">${money(p.price)}</div></div>`).join(''):'<div class="empty">目前分類沒有商品</div>';renderManage()}
function addCustomAmount(){
  let price=Number(customPrice.value);
  let name=(customName.value||'自訂金額').trim()||'自訂金額';
  if(Number.isNaN(price)||price<=0)return alert('請輸入正確的自訂金額');
  cart.push({id:cryptoId(),name,category:'自訂',sub:'',price,qty:1});
  customName.value='';
  customPrice.value='';
  renderCart();
}
function add(id){let p=products.find(x=>x.id===id),it=cart.find(x=>x.id===id);if(it)it.qty++;else cart.push({...p,qty:1});renderCart()}
function adj(id,d){let it=cart.find(x=>x.id===id);if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function calc(){let s=cart.reduce((a,i)=>a+i.price*i.qty,0),raw=Math.max(0,Number(discount.value||0)),disc=dtype.value==='percent'?s*Math.min(raw,100)/100:raw;disc=Math.min(disc,s);let t=s-disc,c=Math.max(0,Number(cash.value||0));return{s,disc,t,c,chg:c-t}}
function renderCart(){cartBox.innerHTML=cart.length?cart.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><div class="muted">${esc(i.category)}${i.sub?' ＞ '+esc(i.sub):''}｜單價 ${money(i.price)}</div><div class="qty"><button class="secondary" onclick="adj('${i.id}',-1)">−</button><span>${i.qty}</span><button class="secondary" onclick="adj('${i.id}',1)">＋</button><button class="danger remove" onclick="removeItem('${i.id}')">移除</button></div></div><b>${money(i.price*i.qty)}</b></div>`).join(''):'<div class="empty">尚未加入商品</div>';let x=calc();subtotal.textContent=money(x.s);discountShow.textContent=money(x.disc);total.textContent=money(x.t);cashShow.textContent=money(x.c);change.textContent=money(Math.abs(x.chg));change.style.color=x.chg<0?'var(--danger)':'var(--ok)'}
function clearCart(){if(cart.length&&!confirm('確定清空本筆訂單？'))return;cart=[];dtype.value='amount';discount.value=0;cash.value=0;note.value='';renderCart()}
function saveOrder(){if(!cart.length)return alert('請先加入商品');let x=calc();if(x.c<x.t&&!confirm('實收金額少於應收金額，仍要儲存嗎？'))return;let order={orderNo:generateOrderNo(),createdAt:nowText(),items:cart.map(i=>({...i,lineTotal:Math.round(i.price*i.qty)})),subtotal:Math.round(x.s),discountType:dtype.value,discountValue:Number(discount.value||0),discountAmount:Math.round(x.disc),total:Math.round(x.t),cashReceived:Math.round(x.c),change:Math.round(x.chg),note:note.value.trim()};orders.unshift(order);saveOrders();clearCart();renderHistory();alert('已儲存訂單：'+order.orderNo)}
function switchHistory(m){historyMode=m;tabSummary.classList.toggle('active',m==='summary');tabDetail.classList.toggle('active',m==='detail');renderHistory()}
function renderHistory(){orderCount.textContent=orders.length+' 筆';if(!orders.length){historyArea.innerHTML='<div class="empty">目前沒有銷售紀錄</div>';return}if(historyMode==='summary'){historyArea.innerHTML=`<table><thead><tr><th>時間</th><th>訂單編號</th><th class="num">小計</th><th class="num">折扣</th><th class="num">應收</th><th class="num">實收</th><th class="num">找零</th><th>備註</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.createdAt)}</td><td>${esc(o.orderNo)}</td><td class="num">${money(o.subtotal)}</td><td class="num">${money(o.discountAmount)}</td><td class="num">${money(o.total)}</td><td class="num">${money(o.cashReceived)}</td><td class="num">${money(o.change)}</td><td>${esc(o.note||'')}</td></tr>`).join('')}</tbody></table>`}else{let rows=orders.flatMap(o=>o.items.map(i=>({...i,orderNo:o.orderNo,createdAt:o.createdAt,note:o.note,orderTotal:o.total})));historyArea.innerHTML=`<table><thead><tr><th>時間</th><th>訂單編號</th><th>主分類</th><th>子分類</th><th>商品</th><th class="num">單價</th><th class="num">數量</th><th class="num">小計</th><th class="num">訂單應收</th><th>備註</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.createdAt)}</td><td>${esc(r.orderNo)}</td><td>${esc(r.category)}</td><td>${esc(r.sub)}</td><td>${esc(r.name)}</td><td class="num">${money(r.price)}</td><td class="num">${r.qty}</td><td class="num">${money(r.lineTotal)}</td><td class="num">${money(r.orderTotal)}</td><td>${esc(r.note||'')}</td></tr>`).join('')}</tbody></table>`}}
function clearHistory(){if(!orders.length)return alert('目前沒有銷售紀錄');if(!confirm('確定清除所有銷售紀錄？'))return;orders=[];saveOrders();renderHistory()}
function renderManage(){if(!productManage)return;let sorted=[...products].sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant')||a.sub.localeCompare(b.sub,'zh-Hant')||a.name.localeCompare(b.name,'zh-Hant'));productManage.innerHTML=sorted.map(p=>`<tr><td><input value="${esc(p.name)}" onchange="editProduct('${p.id}','name',this.value)"></td><td><input value="${esc(p.category)}" onchange="editProduct('${p.id}','category',this.value)"></td><td><input value="${esc(p.sub)}" onchange="editProduct('${p.id}','sub',this.value)"></td><td class="num"><input type="number" value="${p.price}" onchange="editProduct('${p.id}','price',this.value)"></td><td><button class="danger" onclick="deleteProduct('${p.id}')">刪除</button></td></tr>`).join('');categoryList.innerHTML=getMainCategoryButtons().filter(c=>c!=='全部').map(c=>`<option value="${esc(c)}"></option>`).join('')}
function addProduct(){let name=newName.value.trim(),category=newCategory.value.trim()||'未分類',sub=newSubCategory.value.trim(),price=Number(newPrice.value);if(!name)return alert('請輸入商品名稱');if(Number.isNaN(price)||price<0)return alert('請輸入正確價格');products.push({id:cryptoId(),name,category,sub,price});saveProducts();newName.value='';newCategory.value='';newSubCategory.value='';newPrice.value='';current=category;window.sub=sub||'全部';render();alert('已新增商品')}
function editProduct(id,field,value){let p=products.find(x=>x.id===id);if(!p)return;if(field==='price'){let n=Number(value);if(Number.isNaN(n)||n<0)return alert('價格不可為負數');p.price=n}else{p[field]=String(value).trim();if(field==='category'&&!p[field])p[field]='未分類'}saveProducts();cart.forEach(i=>{if(i.id===id)Object.assign(i,p)});render();renderCart()}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p)return;if(!confirm('確定刪除「'+p.name+'」？'))return;products=products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);saveProducts();render();renderCart()}
function resetProducts(){if(!confirm('確定恢復預設動漫分類？目前商品設定會被覆蓋。'))return;products=sampleProducts.map(p=>({...p,id:cryptoId()}));saveProducts();current='全部';sub='全部';render()}
function exportProductsCSV(){downloadText(toCSV(products.map(p=>({'商品名稱':p.name,'主分類':p.category,'子分類':p.sub,'價格':p.price}))),`商品設定_${dateFileName()}.csv`,'text/csv;charset=utf-8;')}
function importProductsCSV(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let rows=parseCSV(ev.target.result).filter(r=>r.some(c=>String(c).trim()!==''));let start=0,idx={name:0,cat:1,sub:2,price:3};let first=(rows[0]||[]).map(x=>String(x).trim().toLowerCase());if(first.some(h=>['商品名稱','商品','name','主分類','分類','category','子分類','subcategory','價格','price'].includes(h))){start=1;idx.name=findHeaderIndex(first,['商品名稱','商品','name']);idx.cat=findHeaderIndex(first,['主分類','分類','category']);idx.sub=findHeaderIndex(first,['子分類','subcategory','類型']);idx.price=findHeaderIndex(first,['價格','price','售價']);if(idx.name<0)idx.name=0;if(idx.cat<0)idx.cat=1;if(idx.sub<0)idx.sub=2;if(idx.price<0)idx.price=rows[0].length>=4?3:2}else if(rows[0].length===3){idx={name:0,cat:1,sub:-1,price:2}}let imported=[];for(let i=start;i<rows.length;i++){let r=rows[i],name=String(r[idx.name]??'').trim(),category=String(r[idx.cat]??'未分類').trim()||'未分類',sub=idx.sub>=0?String(r[idx.sub]??'').trim():'',price=Number(String(r[idx.price]??'').replace(/[$,\s]/g,''));if(name&&!Number.isNaN(price)&&price>=0)imported.push({id:cryptoId(),name,category,sub,price})}if(!imported.length)return alert('沒有成功匯入任何商品');if(!confirm(`將匯入 ${imported.length} 項商品，並覆蓋目前商品清單。確定繼續？`))return;products=imported;cart=[];saveProducts();current='全部';sub='全部';render();renderCart()}catch(err){alert('匯入失敗，請確認 CSV 格式')}finally{e.target.value=''}};reader.readAsText(file,'utf-8')}
function exportCSV(){if(!orders.length)return alert('目前沒有可匯出的銷售紀錄');let {summary,detail}=getExportRows();downloadText(toCSV(summary),`訂單總表_${dateFileName()}.csv`,'text/csv;charset=utf-8;');setTimeout(()=>downloadText(toCSV(detail),`商品明細_${dateFileName()}.csv`,'text/csv;charset=utf-8;'),250)}
function exportExcel(){if(!orders.length)return alert('目前沒有可匯出的銷售紀錄');let {summary,detail}=getExportRows();downloadText(`<html><head><meta charset="UTF-8"></head><body><h2>訂單總表</h2>${rowsToTable(summary)}<br><h2>商品明細</h2>${rowsToTable(detail)}</body></html>`,`銷售紀錄_${dateFileName()}.xls`,'application/vnd.ms-excel;charset=utf-8;')}
function getExportRows(){let summary=orders.map(o=>({'時間':o.createdAt,'訂單編號':o.orderNo,'小計':o.subtotal,'折扣類型':o.discountType==='percent'?'百分比':'金額','折扣輸入值':o.discountValue,'折扣金額':o.discountAmount,'應收':o.total,'實收':o.cashReceived,'找零':o.change,'備註':o.note||''}));let detail=orders.flatMap(o=>o.items.map(i=>({'時間':o.createdAt,'訂單編號':o.orderNo,'主分類':i.category,'子分類':i.sub,'商品':i.name,'單價':i.price,'數量':i.qty,'商品小計':i.lineTotal,'訂單應收':o.total,'訂單備註':o.note||''})));return{summary,detail}}
function rowsToTable(rows){if(!rows.length)return'<table></table>';let keys=Object.keys(rows[0]);return`<table border="1"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function toCSV(rows){if(!rows.length)return'';let keys=Object.keys(rows[0]),e=v=>`"${String(v??'').replace(/"/g,'""')}"`;return'\uFEFF'+keys.join(',')+'\n'+rows.map(r=>keys.map(k=>e(r[k])).join(',')).join('\n')}
function parseCSV(text){let rows=[],row=[],cell='',q=false;text=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let ch=text[i],nx=text[i+1];if(ch==='"'&&q&&nx==='"'){cell+='"';i++}else if(ch==='"')q=!q;else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);rows.push(row);return rows}
function findHeaderIndex(headers,cands){return headers.findIndex(h=>cands.map(c=>c.toLowerCase()).includes(h))}
function downloadText(text,filename,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function receiptText(){let x=calc(),lines=['【結帳收據】',nowText(),'-------------------------'];cart.forEach(i=>lines.push(`${i.category}${i.sub?'>'+i.sub:''}｜${i.name} x${i.qty} @${i.price} = ${i.price*i.qty}`));lines.push('-------------------------',`小計：${Math.round(x.s)}`,`折扣：${Math.round(x.disc)}`,`應收：${Math.round(x.t)}`,`實收：${Math.round(x.c)}`,`${x.chg>=0?'找零':'尚缺'}：${Math.abs(Math.round(x.chg))}`);if(note.value.trim())lines.push(`備註：${note.value.trim()}`);return lines.join('\n')}
async function copyReceipt(){if(!cart.length)return alert('目前沒有商品可複製');try{await navigator.clipboard.writeText(receiptText());alert('已複製收據文字')}catch{alert(receiptText())}}
function openCashModal(){let x=calc();modalTotal.textContent=money(x.t);modalCashInput.value=x.c||x.t||0;cashModal.classList.add('active')}
function closeCashModal(){cashModal.classList.remove('active')}
function setExactCash(){modalCashInput.value=Math.round(calc().t)}
function addCash(a){modalCashInput.value=Math.max(0,Number(modalCashInput.value||0)+a)}
function roundCash(u){let x=calc();modalCashInput.value=Math.ceil(x.t/u)*u}
function applyCash(){cash.value=Math.max(0,Number(modalCashInput.value||0));closeCashModal();renderCart()}
render();renderCart();renderHistory();
</script>
